services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - highlight-work:/app/work
    ports:
      - "${HOST_API_PORT:-8800}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "${HOST_WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  highlight-work:
